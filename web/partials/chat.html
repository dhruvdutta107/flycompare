<div id="chat-root" class="no-print">
  <button type="button" id="chat-fab" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-panel"
    class="fixed right-5 z-[70] flex items-center gap-2 h-14 pl-4 pr-5 rounded-full bg-primary text-white shadow-xl shadow-primary/30 hover:shadow-2xl hover:bg-[#005a6f] focus-visible:ring-4 focus-visible:ring-sky-300">
    <span class="material-symbols-outlined icon-fill" aria-hidden="true" data-fab-icon>support_agent</span>
    <span class="font-bold text-sm hidden sm:inline" data-fab-label>Need help?</span>
    <span id="chat-unread" hidden class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-red-500 text-[11px] font-bold flex items-center justify-center ring-2 ring-white dark:ring-slate-900">1</span>
  </button>

  <section id="chat-panel" role="dialog" aria-modal="false" aria-labelledby="chat-title" hidden
    class="fixed z-[75] inset-x-2 bottom-2 top-16 sm:inset-auto sm:right-5 sm:bottom-24 sm:w-[390px] sm:h-[min(600px,calc(100vh-8rem))] flex flex-col overflow-hidden rounded-2xl border border-surface-variant dark:border-slate-700 bg-surface-container-lowest dark:bg-slate-900 shadow-2xl">
    <header class="flex items-center gap-3 px-4 py-3 bg-gradient-to-r from-primary to-brand text-white">
      <span class="relative flex items-center justify-center w-10 h-10 rounded-full bg-white/15" aria-hidden="true">
        <span class="material-symbols-outlined icon-fill">support_agent</span>
        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 ring-2 ring-primary"></span>
      </span>
      <div class="min-w-0 flex-1">
        <h2 id="chat-title" class="font-bold leading-tight">FlyCompare Assistant</h2>
        <p class="text-xs text-white/80" id="chat-sub">Online &middot; replies in seconds</p>
      </div>
      <button type="button" id="chat-reset" class="p-2 rounded-full hover:bg-white/15" aria-label="Start a new conversation" title="New conversation"><span class="material-symbols-outlined text-[20px]" aria-hidden="true">restart_alt</span></button>
      <button type="button" id="chat-close" class="p-2 rounded-full hover:bg-white/15" aria-label="Close chat" title="Close (Esc)"><span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span></button>
    </header>
    <div id="chat-log" role="log" aria-live="polite" aria-relevant="additions" class="flex-1 overflow-y-auto custom-scrollbar px-4 py-4 space-y-3 bg-surface-container-low/60 dark:bg-slate-900"></div>
    <div id="chat-suggest" class="flex gap-2 overflow-x-auto custom-scrollbar px-3 pt-2 pb-1 bg-surface-container-lowest dark:bg-slate-900" aria-label="Suggested questions"></div>
    <form id="chat-form" class="flex items-end gap-2 p-3 border-t border-surface-variant dark:border-slate-700 bg-surface-container-lowest dark:bg-slate-900" novalidate>
      <label for="chat-input" class="sr-only">Type your message</label>
      <textarea id="chat-input" rows="1" maxlength="800" placeholder="Ask about a flight, refund, cab..." class="flex-1 resize-none max-h-28 rounded-xl border border-surface-variant dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm focus:border-primary focus:ring-2 focus:ring-primary/20"></textarea>
      <button type="submit" id="chat-send" disabled class="shrink-0 w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center disabled:opacity-40 hover:bg-[#005a6f]" aria-label="Send message"><span class="material-symbols-outlined icon-fill text-[20px]" aria-hidden="true">send</span></button>
    </form>
    <p class="px-3 pb-2 -mt-1 text-[10px] text-on-surface-variant dark:text-slate-500 bg-surface-container-lowest dark:bg-slate-900">Demo assistant &middot; never share card numbers or passwords in chat.</p>
  </section>
</div>
