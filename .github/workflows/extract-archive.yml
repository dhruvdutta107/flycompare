name: Extract FlyCompare source archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Extract FlyCompare source [skip extract]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project files
        run: |
          python - <<'PY'
          import os
          import zipfile
          archive = "flycompare-improved.zip"
          if not os.path.exists(archive):
              raise SystemExit(f"Expected {archive} in the repository root")
          with zipfile.ZipFile(archive) as z:
              z.extractall(".")
          os.remove(archive)
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract FlyCompare source [skip extract]"
          git push
